upstream comfy_backend {
  server 100.107.28.68:8188 max_fails=2 fail_timeout=5s;
  server 127.0.0.1:8188 backup;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;

  ssl_certificate_key /etc/nginx/ssl-certificates/comfy.vmstudio.digital.key;
  ssl_certificate /etc/nginx/ssl-certificates/comfy.vmstudio.digital.crt;
  server_name comfy.vmstudio.digital;

  access_log /var/log/nginx/comfy_access.log;
  error_log /var/log/nginx/comfy_error.log;

  client_max_body_size 256M;

  location / {
    proxy_pass http://comfy_backend;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
