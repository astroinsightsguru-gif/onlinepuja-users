proxy_cache_path /var/cache/nginx/onlinepuja levels=1:2 keys_zone=ONLINEPUJA_CACHE:50m max_size=500m inactive=1440m use_temp_path=off;
proxy_cache_path /var/cache/nginx/vmstudio levels=1:2 keys_zone=VMSTUDIO_CACHE:50m max_size=500m inactive=1440m use_temp_path=off;
proxy_cache_path /var/cache/nginx/tripcosmos levels=1:2 keys_zone=TRIPCOSMOS_CACHE:50m max_size=500m inactive=1440m use_temp_path=off;

# WebP Content Negotiation Map
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}
