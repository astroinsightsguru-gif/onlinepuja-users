server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/onlinepuja.live.key;
  ssl_certificate /etc/nginx/ssl-certificates/onlinepuja.live.crt;
  server_name www.onlinepuja.live;
  return 301 https://onlinepuja.live$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/onlinepuja.live.key;
  ssl_certificate /etc/nginx/ssl-certificates/onlinepuja.live.crt;
  server_name onlinepuja.live www1.onlinepuja.live;
  root /home/onlinepujalive/htdocs/onlinepuja.live/public;
  disable_symlinks off;
  rewrite ^/public/(.*)$ /$1 last;

  access_log /home/onlinepujalive/logs/nginx/access.log main;
  error_log /home/onlinepujalive/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  

  include /etc/nginx/global_settings;

    location ~* \.apk$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "-1" always;
  }
  location ^~ /manager/ {
    alias /home/onlinepujalive/htdocs/onlinepuja.live/public/manager/;
    try_files $uri $uri/ /manager/index.html;
    add_header Expires '-1' always;

    location ~* \.(html|json)$ {
      expires -1;
    }

    location ~* \.(js|mjs)$ {
      expires -1;
    }
  }

  # Block aggressive scrapers & spider traps that flood PHP-FPM
  if ($http_user_agent ~* "(MJ12bot|PetalBot|SemrushBot|Bytespider|DotBot|meta-externalagent|meta-webindexer)") {
    return 403;
  }

  set $skip_cache 0;

  if ($request_method = POST) {
    set $skip_cache 1;
  }

  # Never cache dynamic, transactional, or private routes
  if ($request_uri ~* "(/api/|/admin|/checkout|/my-account|/chat|/call|/wallet|/login|/register|/payment|/manager|/voice-assistant)") {
    set $skip_cache 1;
  }

  # Never cache authenticated user requests
  if ($http_authorization != "") {
    set $skip_cache 1;
  }
  if ($http_cookie ~* "token=|auth_token|laravel_session") {
    set $skip_cache 1;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;

    proxy_cache ONLINEPUJA_CACHE;
    proxy_cache_bypass $skip_cache;
    proxy_no_cache $skip_cache;
    proxy_cache_valid 200 301 302 30m;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-OP-Cache $upstream_cache_status;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name onlinepuja.live www1.onlinepuja.live;
  root /home/onlinepujalive/htdocs/onlinepuja.live/public;
  disable_symlinks off;
  rewrite ^/public/(.*)$ /$1 last;

    location ~* \.apk$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "-1" always;
  }
  location ^~ /manager/ {
    alias /home/onlinepujalive/htdocs/onlinepuja.live/public/manager/;
    try_files $uri $uri/ /manager/index.html;
    add_header Expires '-1' always;

    location ~* \.(html|json)$ {
      expires -1;
    }

    location ~* \.(js|mjs)$ {
      expires -1;
    }
  }

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:18005;
    fastcgi_param PHP_VALUE "
error_log=/home/onlinepujalive/logs/php/error.log;
memory_limit=512M;
max_execution_time=60;
max_input_time=60;
max_input_vars=10000;
post_max_size=64M;
upload_max_filesize=64M;
date.timezone=UTC;
display_errors=off;";
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
