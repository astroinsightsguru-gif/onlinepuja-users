<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="OnlinePuja Varanasi Sanctuary Executive Operations, Devotee CRM & Growth OS">

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="943854607420-9q5ro9tfc1ms9n3987ovb8vsidlcs04r.apps.googleusercontent.com">

  <!-- Theme color for PWA window & browser header -->
  <meta name="theme-color" content="#0F172A">
  <meta name="msapplication-navbutton-color" content="#0F172A">

  <!-- iOS & Android PWA standalone capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puja Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OnlinePuja Manager | Executive CRM & Growth OS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B141A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B141A;
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #E2E8F0;
    }
    .loading-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">OnlinePuja Manager</div>
    <div class="loading-sub">Connecting to Varanasi Sanctuary Hub...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script>
    let managerRecognition = null;
    window.startManagerSpeech = function() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported on this browser.");
        return false;
      }
      if (managerRecognition) {
        try { managerRecognition.abort(); } catch(e){}
      }
      managerRecognition = new SpeechRecognition();
      managerRecognition.lang = 'hi-IN';
      managerRecognition.continuous = false;
      managerRecognition.interimResults = false;

      managerRecognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        if (window.onManagerSpeechResult) {
          window.onManagerSpeechResult(text);
        }
      };

      managerRecognition.onend = function() {
        if (window.onManagerSpeechEnd) {
          window.onManagerSpeechEnd();
        }
      };

      managerRecognition.onerror = function(err) {
        console.warn("Manager speech error:", err);
        if (window.onManagerSpeechEnd) {
          window.onManagerSpeechEnd();
        }
      };

      try {
        managerRecognition.start();
        return true;
      } catch(e) {
        console.error("Start speech failed:", e);
        return false;
      }
    };

    window.stopManagerSpeech = function() {
      if (managerRecognition) {
        try { managerRecognition.stop(); } catch(e){}
      }
    };

    window.speakManagerResponse = function(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/[*#_~`]/g, '').replace(/https?:\/\/\S+/g, '');
      const u = new SpeechSynthesisUtterance(clean.substring(0, 350));
      u.lang = 'hi-IN';
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
